kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# Local snapshot while the demo/docs refactor is in flight. Bump to the released coordinate
# (io.github.shijianjs:ktjs-wrapper-kit:<version>) before publishing this module.
ktjs-wrapper-kit.version=0.1.0-SNAPSHOT

# The demo shell (layout, menu, router, pages) lives in the ktjs-dom-kit repository and is consumed
# from mavenLocal while this refactor is in flight: every module is published there with
# `publishToMavenLocal` and nothing reaches Central before the whole batch is signed off.
ktjs-demo-kit.version=0.1.0-SNAPSHOT

# The ktjs-docusaurus versions the docs site is built with: the Gradle plugin and the wrapper klib
# both come from that project, but each module carries its own `-kt.N` revision, so the numbers are
# independent and both are needed. `mavenLocal` resolves the SNAPSHOT a working tree publishes.
ktjs-docusaurus.version=3.10.2-kt.2-SNAPSHOT
ktjs-docusaurus-gradle-plugin.version=3.10.2-kt.1-SNAPSHOT
ktjs-docusaurus-kit.version=0.1.0-SNAPSHOT

# `ktjs-dom-kit` is the custom-element kit the demos build on; `ktjs-dom-kit-ksp` is its processor.
# A working tree there publishes `0.1.0-SNAPSHOT` to `mavenLocal`, and `settings.gradle.kts` resolves it.
ktjs-dom-kit.version=0.1.0-SNAPSHOT
