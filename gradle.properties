kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# Artifact and plugin versions are not kept here: `gradle/libs.versions.toml` is the single list,
# read through the generated `libs` accessor. This file only holds Gradle/Kotlin user settings.
#
# That includes the ktjs-docusaurus triple (plugin, wrapper klib, kit), the typed attribute layer
# (`ktjs-wrapper-kit`), the demo shell (`ktjs-demo-kit`) and the element processor
# (`ktjs-dom-kit-ksp`). A `-SNAPSHOT` one resolves from `mavenLocal`: every working tree there
# publishes it with `./gradlew publishToMavenLocal`, and nothing reaches Central before the whole
# batch is signed off.
